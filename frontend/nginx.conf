# Rendered by the nginx image's envsubst at start-up: ${BACKEND_URL} is replaced,
# nginx's own $variables are left untouched because they are not environment variables.

# Pass through the scheme/host an outer reverse proxy (Cloudflare Tunnel, Traefik, NPM,
# Caddy...) reports, falling back to this server's own values when there is no proxy in front.
map $http_x_forwarded_proto $tallyfin_proto {
    default $http_x_forwarded_proto;
    ""      $tallyfin_proto_fallback;
}
# Cloudflare also sends CF-Visitor: {"scheme":"https"}; use it when X-Forwarded-Proto is absent.
map $http_cf_visitor $tallyfin_proto_fallback {
    default $scheme;
    "~https" https;
}
map $http_x_forwarded_host $tallyfin_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tallyfin_proto;
        proxy_set_header X-Forwarded-Host $tallyfin_host;
        proxy_read_timeout 120s;
    }

    # Django admin (optional, handy for inspecting data) and its static files.
    location /admin/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tallyfin_proto;
        proxy_set_header X-Forwarded-Host $tallyfin_host;
    }
    location /static/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
